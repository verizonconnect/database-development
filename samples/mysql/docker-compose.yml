services:
    rules-generator:
        build: ${generate_rules_image}
        command: ["-f", "/app/coding_standard.yml", "-o", "/src/.sqlfluff"]
        volumes:
          - ./lint/coding_standard.yml:/app/coding_standard.yml
          - ./src:/src
    lint:
        build: ${sqlfluff_image}
        entrypoint: ["/bin/bash", "-c"]
        command: ["sqlfluff lint ${lint_verbosity} --write-output ${lint_output_path} /sql || true"]
        volumes:
            - ./src/:/sql
            - ./src/.sqlfluff:/sqlfluff/.sqlfluff
            - ./lint/:/lint/
        depends_on:
            rules-generator:
                condition: service_completed_successfully
    mysql:
        build: ${image}
        container_name: ${container_name}
        command:
        - --mysql-native-password=ON
        - --log-bin-trust-function-creators=1
        volumes:
        - ./init/000-init.sql:/docker-entrypoint-initdb.d/000-init.sql
        environment:
            - MYSQL_ROOT_PASSWORD=${password}
        ports:
            - ${host_port}:3306
        restart: always
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${password}"]
            timeout: 10s
            retries: 5
        depends_on:
            lint:
                condition: service_completed_successfully
    flyway:
        image: ${flyway_image}
        command: migrate
        environment:
            - FLYWAY_URL=jdbc:mysql://${container_name}:3306/${database_name}?allowPublicKeyRetrieval=true
            - FLYWAY_USER=${user}
            - FLYWAY_PASSWORD=${password}
            - FLYWAY_DEFAULT_SCHEMA=${default_schema}
            - FLYWAY_SQL_MIGRATION_PREFIX=${sql_migration_prefix}
            - FLYWAY_REPEATABLE_SQL_MIGRATION_PREFIX=${repeatable_sql_migration_prefix}
            - FLYWAY_MIXED=${mixed}
            - FLYWAY_PLACEHOLDERS_environment_name=${environment_name}
        volumes:
            - ./src/:/flyway/sql
        depends_on:
            mysql:
                condition: service_healthy
    cover_trace:
        build: ${coverage_image}
        command: ["trace", "-E", "mysql", "-H", "${container_name}", "-p", "3306", "-d", "${database_name}", "-U", "${user}", "-W", "${password}", "-c", "/coverage/cache"]
        volumes:
            - ./coverage/:/coverage/
        depends_on:
            flyway:
                condition: "service_completed_successfully"
    tap_installer:
        build: ${tap_installer}
        volumes:
            - ./test/:/opt/test_cases
        command: >
          bash -c "
            mysql -h ${container_name} -u root -p${password} -e 'CREATE DATABASE IF NOT EXISTS tap;' &&
            mysql -h ${container_name} -u root -p${password} -e 'SET GLOBAL log_bin_trust_function_creators = 1;' 2>/dev/null;
            cd /mytap &&
            for f in mytap.sql mytap-table.sql mytap-routines.sql mytap-column.sql mytap-constraint.sql mytap-index.sql mytap-trigger.sql mytap-view.sql mytap-event.sql mytap-partition.sql mytap-schemata.sql mytap-user.sql mytap-role.sql mytap-charset.sql mytap-collation.sql mytap-engine.sql; do
              if [ -f \"$$f\" ]; then
                mysql -h ${container_name} -u root -p${password} tap < \"$$f\" 2>&1 && echo \"Loaded $$f\" || echo \"FAILED $$f\";
              fi;
            done &&
            mysql -h ${container_name} -u root -p${password} -e 'SELECT COUNT(*) AS mytap_routines FROM information_schema.routines WHERE routine_schema = \"tap\";' &&
            mysql -h ${container_name} -u root -p${password} -e 'SELECT routine_schema, routine_name FROM information_schema.routines WHERE routine_schema = \"common\" ORDER BY routine_name;'
          "
        depends_on:
            cover_trace:
                condition: "service_completed_successfully"
    unit_test:
        build: ${tap_installer}
        volumes:
            - ./test/:/opt/test_cases
        depends_on:
            tap_installer:
                condition: "service_completed_successfully"
        command: >
            bash -c "my_prove --nocount --nocolor -h ${container_name} -u ${user} -p${password} -D tap --ext .sql -r /opt/test_cases/"
    cover_report:
        build: ${coverage_image}
        command: ["report", "-E", "mysql", "-H", "${container_name}", "-p", "3306", "-d", "${database_name}", "-U", "${user}", "-W", "${password}", "-c", "/coverage/cache", "-o", "/coverage/opencover.xml"]
        volumes:
            - ./coverage/:/coverage/
        depends_on:
            unit_test:
                condition: "service_completed_successfully"
    cover_untrace:
        build: ${coverage_image}
        command: ["untrace", "-E", "mysql", "-H", "${container_name}", "-p", "3306", "-d", "${database_name}", "-U", "${user}", "-W", "${password}", "-c", "/coverage/cache"]
        volumes:
            - ./coverage/:/coverage/
        depends_on:
            cover_report:
                condition: "service_completed_successfully"
